[pytest]
# Two test packages, one repo: `.claude/skills/sdlc-studio/scripts/tests` (the shipped skill
# scripts) and `tools/tests` (the repo-only guards). Both directories are named `tests`, so
# under pytest's default prepend import mode both claim the module name `tests` and the second
# one collected dies with `ModuleNotFoundError: No module named 'tests.<module>'`. A unit whose
# change spanned the two halves of the gate therefore had no single executable proof - four
# delivery lanes hit it independently in one run.
#
# importlib mode derives a unique module name per file instead of one per directory, so the two
# packages stop colliding. Neither directory is renamed: a rename would break every `Verify:`
# line that pins a path in it, which is the wrong price for a config defect.
#
# Pinned here rather than in each invocation on purpose: a flag every Verify line has to
# remember is the same defect one layer up. Guarded by tools/tests/test_pytest_collection.py.
addopts = --import-mode=importlib
