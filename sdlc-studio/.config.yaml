# Project configuration for sdlc-studio (merged over templates/config-defaults.yaml).
# Dotted keys are read by scripts via sdlc_md.project_override.

# Pinned to schema v2 explicitly: this repo dogfoods the skill on the v2 schema and must
# not be flipped by any change to the new-project default. v4-line work stays era-gated.
schema_version: 2

provenance:
  # Provenance landed mid-stream (CR0052/CR0057). Artifacts created before the tool
  # stamped were authored by hand; exempt them so `provenance check` judges only new work.
  # The cutoff is a global id-number threshold (idn <= cutoff is exempt); 57 covers every
  # artifact that exists today (max is CR0057). The tool stamps all new artifacts, so the
  # only thing this could miss is a hand-authored future artifact whose type-number is still
  # below 57 - acceptable, since hand-authoring is the path we are steering away from.
  adopt_after: 57
  enforce: false  # advisory (report, do not block) - flip to true to gate on provenance

conformance:
  # Story-scoped conformance is grandfathered forward-only: this repo's delivery is gated by
  # its committed script suite plus the critic + gate, not by per-story verify_ac backfill.
  # 82 covers every story that exists at the v4 foundation (max is US0082); new stories past
  # it are held to the full standard.
  #
  # Briefly raised to 115 at the RUN-01KY03GS close for US0112/US0115, then restored to 82
  # when BG0234 landed: their AC2/AC1 asserted repo-WIDE invariants (zero archival advisories,
  # zero disclosure warnings) as executable checks, so unrelated later growth re-ran them red
  # and un-Doned a shipped story. Both were point-in-time cleanups, so their Verify lines are
  # now `manual` (verified at delivery), which is the honest classification and stops the
  # false un-Done at the source. No standing exemption was needed.
  #
  # RAISED 82 -> 310 at the RUN-01KY3MFX close (D0055). The 23 stories US0288-US0310 reached
  # Done on the operator's sign-off, but `sprint_covers_independently` accepts a sprint-level
  # review as evidence ONLY on an APPROVE, and all ten adversarial rounds returned REJECT - the
  # code converged at round 7, the prose never did. So they read `missing critiqued` and every
  # commit blocked. BLAST RADIUS, stated because a threshold is not a list: this exempts 228
  # units, not 23, including many already conformant. RESTORE TO 82 when CR0404 lands (a REJECT
  # carried forward as filed findings) or when a round returns APPROVE - whichever comes first.
  #
  # RESTORED 310 -> 82 on 2026-07-27 (BG0302). Both restore conditions have now fired: CR0404 is
  # Complete (2026-07-23) and RV0020 recorded an APPROVE ratified by the reviewer of record
  # (2026-07-27). The raise outlived its own stated expiry by four days, exempting 228 units that
  # were never in scope for it, so the restore is the whole point of naming a condition. The
  # findings the re-armed gate reports are the real backlog it was hiding, not a regression.
  #
  # RAISED 82 -> 310 AGAIN on 2026-07-28, at the RUN-01KYKVZM close, on the operator's explicit
  # ruling (D0073) after being shown that this is the same raise BG0302 reverted the day before.
  # The re-armed gate blocked a DIFFERENT sprint's sign-off: US0288-US0310 still read `missing
  # critiqued`, because BG0302's restore condition was read as satisfied by RV0020's APPROVE,
  # and that APPROVE covers a later batch rather than these 23 units. A restore condition that
  # names "an APPROVE" without naming WHICH UNITS it must cover is the defect, not the raise.
  #
  # BLAST RADIUS, restated because a threshold is still not a list: this exempts 228 units, not
  # the 23 that need it. A narrower act was available and declined - the reviewer of record can
  # sign off US0288-US0310 directly, as they did for RUN-01KYKVZM's 31.
  #
  # RESTORE TO 82 when an APPROVE COVERING US0288-US0310 SPECIFICALLY is recorded, or when
  # those 23 units are signed off individually. Not "when an APPROVE exists" - that is the
  # wording that let the last raise outlive its expiry by four days.
  #
  # RESTORED 310 -> 82 the SAME DAY, 2026-07-28 (D0076). The named condition fired within the
  # hour: the operator approved US0288-US0310 specifically rather than accepting the threshold.
  # Both missing halves are now real records against those 23 units - the adversarial pass
  # recorded as per-unit evidence pointing at the ten rounds that actually ran, and an APPROVE
  # from the reviewer of record resting on the round-7 convergence (zero logic defects; the
  # residue was prose). The raise existed for 23 units and exempted 228; the approval covers
  # the 23 and exempts none. This is what the restore condition was for, and naming the UNITS
  # rather than "an APPROVE" is why it fired in an hour instead of outliving itself by four days.
  adopt_after: 82

review:
  # D0129: a REJECT files its findings and the run SHIPS, rather than holding until the tree is
  # clean. Adopted on RUN-01KZ79C1, where two seats REJECTed a 10-unit batch on 11 real findings
  # and `block` would have held six delivered gate fixes hostage to a sprint's worth of repair.
  # Every finding must still be filed or explicitly waived - nothing is discarded. Revisit once
  # CR0510 (ceremony by blast radius) and EP0207 (test-plan-before-code) are in force.
  policy: carry-forward
  # Two-role review gate (RFC0044/CR0323), forward-only from the sprint that built it:
  # units past US0192 clear `critiqued` only with the adversarial pass recorded as
  # evidence AND an independent reviewer-of-record sign-off (critic.py evidence/signoff).
  # Under it, Done means signed off - units hold at Review until the close ceremony.
  two_role_after: 192
  # D0130: the reviewer of record may be a NAMED SEAT, held disjoint from the adversarial ones.
  # The operator's framing, recorded because it is the whole argument: "human in the loop is too
  # slow for true AI speed; human in the lead is the best approach." The independence rule is
  # unchanged - it is about SEPARATE CONTEXT AND SEPARATE INCENTIVES, which a fresh seat has and
  # a tired person rubber-stamping ten units at the end of a long day does not.
  #
  # What this does NOT relax: three distinct contexts are still enforced (author, adversarial
  # reviewer, signer), the signer is READ from the run's recorded assignment rather than named at
  # signing time, and a panel may not ratify a verdict carrying no brief provenance. The record
  # states plainly that a seat signed - `capacity: seat` - so no reader can mistake it for a
  # person's signature, and `sprint_report.py operator-summary` derives the page the operator
  # leads from. Adopted on RUN-01KZ9315, the sprint that made the path reachable (US0643).
  signoff: panel
  # D0131: the test-plan gate goes live, dated so it captures the bug lane and exempts the
  # story lane. That is chosen, not arbitrary. EP0207 shipped the mechanism on RUN-01KZBBZ0 and
  # its own units could not measure it - the cutoff that protects an existing backlog necessarily
  # exempts the batch that builds the gate, so the claim "reviewing the test costs a fraction of
  # reviewing the code" stayed an assertion. This date makes the NEXT sprint an A/B in one batch:
  # units created from 2026-08-01 (the recent bugs) derive and independently review a test plan
  # before any code; older units (the stories) do not. `retro.py accuracy` reports both arms, and
  # that number decides whether this process is pointed at the remaining unplanned backlog.
  test_plan_after: "2026-08-01"
  # D0146 (2026-08-21) CUTS this from 6 to 2, superseding D0132's raise, and the reason is a
  # measurement rather than a preference. D0132 raised it to 6 saying "revisit if a run reaches 6";
  # RUN-01M0CT8P reached 5 delivery rounds on 6 units, and the marginal yield of those rounds is
  # now known. Round 1 caught a defect that would have SHIPPED - a production change deletable
  # with all 916 tests in its own file still green. Rounds 2 to 5 caught only defects in the
  # EVIDENCE apparatus, most of them manufactured by the mutation registration ledger rather than
  # found in the code. That run cost 525,434 tokens per point against a 44,427 forecast.
  # Round 3 onward FILES its findings rather than holding the batch, which is what
  # `policy: carry-forward` above already says and which a cap of 6 contradicted in practice.
  # NOT relaxed by this, stated so nobody reads it as a general loosening: two-role review is
  # untouched, and the authoring-time rule that a criterion names a production change its own
  # test dies on still applies at every band - that rule is what caught round 1's defect. Only
  # the register/retract/join LEDGER around it is in scope for narrowing, by CR0550.
  # RAISED to 3 by D0175, 2026-08-29, on the operator's ruling. The cap was reading a round
  # COUNT and reporting a run as non-convergent while every rejected unit read
  # repair=complete with zero outstanding findings - two different facts. D0146's measured
  # basis stands as guidance on how many rounds to SPEND, and a third round is not routine:
  # in RUN-01M11MEP it was the round that found data loss at exit 0 and a severity guard
  # that could refuse every input, both of which a cap of 2 would have shipped.
  max_rounds: 12
  # TWELVE, not three, and the number is not the point - BG0635 is. The series counts
  # ADVISORY gate lanes as outstanding, so `loop_termination`'s converged branch is
  # unreachable in this repository and the cap trips at whatever value it holds. This run
  # recorded 5, 5, 4, 4, 4 with every unit signed off and zero real blockers. The cap is
  # raised because it is the lever the close itself names, NOT because twelve rounds are
  # acceptable; the gate refusing this run was deliberately left unrepaired (L-0344), so
  # the wall stays visible until BG0635 lands. Put this back to 3 when it does - D0176.

engagement_floor:
  # The mechanical engagement floor is grandfathered forward-only, like conformance/provenance.
  # This repo's early bugs/CRs shipped multi-file fixes with no per-unit AC (the delivery gate
  # was the script suite + critic, not a formal AC), so the floor exempts every unit that exists
  # at v4.1 adoption. 238 covers the current maxima (US0119/BG0117/CR0238); any new multi-file
  # story/bug/CR past it must carry an AC, a Verify line, or a linked plan - or a recorded waiver.
  adopt_after: 238

estimator:
  # The coercion check (`retro.py estimator`). BG0136 made `Effort` COMPULSORY at filing, so
  # every unit filed after it had to carry one - and a compulsory estimate from someone who does
  # not want to estimate is a careless estimate, which is worse than none because it looks like
  # data. That hazard is testable, and this is the boundary it is tested across.
  #
  # Going forward NOTHING here is needed: the planner STAMPS the era on every forecast record it
  # writes, and a stamp always beats this declaration. This exists only for the evidence recorded
  # BEFORE the stamp did, and it is a DECLARATION a human made by reading the filing history -
  # never an inference from a commit date, which is when work was COMMITTED, not when the size
  # was written.
  #
  # BG0136 itself and everything before it: voluntary. CR0260 is the last CR filed before the
  # gate landed.
  compulsory_after:
    BG: 136
    CR: 260

# Sprint capacity - this repo's own ceiling, deliberately NOT the shipped default (500,000).
# Measured, not forecast: the last 5-unit sprint cost 642,358 tokens of real subagent spend
# (RETRO0025). The shipped default was derived from a 6-unit sprint that cost 384k, which is
# below what a normal sprint here actually costs - so it would flag almost every batch, and a
# warning that always fires is one an operator learns to scroll past.
#
# 1,000,000 sits just above the WORST measured sprint (RETRO0026: 5 units, 902,503 tokens).
# Raised from 700,000 on 2026-07-14 after that sprint blew straight through it. Two measured
# sprints now: 642,358 and 902,503. The old note said 700,000 sat just above the one sprint we had: a normal batch passes,
# a genuinely oversized one still trips. It is an OPERATOR SETTING, not a fitted constant, and
# it is set here rather than in templates/config-defaults.yaml because 642k is this repo's cost
# with this model and these briefs - another project's units cost something else entirely.
#
# Read it against BG0133: until a forecast is recorded at PLAN TIME, the token half of this
# check is built on an estimator known to under-forecast by ~1.8x, so `within budget` currently
# means less than it appears to.
# Set 2026-07-24 (D0064) from the measured VELOCITY rows, not picked. The previous ceiling
# (1M / 8 units / 240 min) predated every sprint in the record: the last four ran 44, 19, 28
# and 18 units at 6.7M-8.3M tokens, so EVERY plan reported OVER BUDGET and the one instrument
# meant to say "this batch does not fit" had become a constant (CR0419).
# Basis: Sprint 2 measured 240k tokens/unit and 75.5k/point. Sprint 3b is ~64 units / ~160
# points, which lands near 15M. Re-derive from retros/VELOCITY.md when the shape changes -
# a ceiling nobody chose against evidence is how this got stale the first time.
# `minutes` re-set 2026-08-21 (D0147) from measurement, 960 -> 2880. 960 had been reported SPENT
# on run after run and stopped nothing - it fired six consecutive times on RUN-01M0CT8P while that
# run continued to a clean close, and a ceiling that only narrates its own breach is not one.
# Basis, and it is thin: three runs carry a recorded elapsed figure - roughly 2,026, 2,839 and
# 5,271 minutes. 2880 is two calendar days, the middle of those three, and one measurement better
# than 960, which rests on none.
# READ IT AS CALENDAR AGE, NOT COST. `loop_guard.elapsed_minutes` returns `now - started_at` and
# subtracts nothing for intervals in which no work happened; RUN-01M0CT8P spanned two nights with
# no process running. CR0551 derives working time from the evidence a run leaves and reports idle
# intervals as excluded rather than dropped. Until it lands this bounds how long a run may stay
# OPEN, not what it may cost - and the token ceiling above is the figure that bounds the cost.
capacity:
  tokens: 15000000
  # Re-declared 2026-08-25 as a STANDING decision, not a per-run resize. The ceiling measures
  # WALL-CLOCK since the run opened (CR0551), so a run spanning more than two days burns it
  # without a minute of work: RUN-01M0JD1W read 4308 of 2880 while its working time was a
  # fraction of that. INTERIM by decision - when CR0551 lands this should be re-declared
  # against working minutes rather than raised again. A `sprint appetite resize` recorded
  # this for one run only and left the standing figure here untouched, which is why the
  # value is being set here rather than by that command.
  minutes: 5760
  units: 64

two_backlog:
  enforce: true  # this repo dogfoods the two-backlog workflow; keep the gates on

# The per-commit gate budget (RFC0048 D6). A DECLARATION the operator made against a measured
# baseline, never a fitted constant, and it is recorded WITH that baseline because a ceiling
# without the measurement it was chosen against cannot be reviewed later.
#
# D6's problem statement: without a target number every future guard is individually
# justifiable and the ratchet never stops. That is not hypothetical here - between 19 and 21
# July test_gate.py grew 56.4s -> 72.2s (+28%) while gaining three tests, and nobody noticed,
# because it was under every ceiling the whole time. So the check reports the TREND against the
# dated baseline, not just a pass or fail.
#
# Baseline: 99s, the first END-TO-END measurement the hook recorded itself, on 2026-07-21.
# Component sum for reference: skill-tests 78.1s (was 153.1s) + gate 6.95s (was 35.6s) +
# guards 8.0s = 93.1s. The pre-EP0093 equivalent was 196.7s, so the budget sits well below what
# a commit cost two days earlier.
#
# The baseline is the hook's OWN figure, not that component sum. The adversarial review of
# RUN-01KY1WCR pointed out that 93.1 was a hand-arithmetic total of three separately-timed runs
# and the hook was recording 99s and 83s for the same work, so a zero-change commit could read
# +6% or -11%. A baseline the check cannot itself reproduce is not a baseline.
#
# KNOWN LIMIT, worth stating rather than discovering later: same-machine run-to-run variance
# measured ~19% (83s vs 99s), which is comparable to the ~28% ratchet this lane exists to
# expose. So a single reading means little; the series is the signal, and a drift is only real
# once several consecutive runs sit above the baseline. That is also why 120s is not tighter.
#
# 120s is ~21% headroom over 99s: enough to absorb that variance without the lane becoming noise
# that gets scrolled past. ADVISORY ALWAYS - a wall-clock check on a loaded or shared machine
# must never refuse a correct commit, which is the same call D3 made for mutation. Only commits
# that actually ran the unit suites are recorded, or docs-only runs would flood the series with
# 9-14s entries that make real drift unreadable.
gate_budget:
  # Re-declared 2026-07-26 against the measured ~317s peak (skill-tests ~198s + tool-tests ~78s +
  # cheap lanes ~40s): the 120s ceiling was set when the suites were half the size and fired OVER
  # on every commit, so the signal had become noise. The ceiling carries ~20% headroom over the
  # measured peak, so a normal commit reads under budget while a genuine regression still flags.
  seconds: 380
  baseline_seconds: 317
  baseline_date: 2026-07-26
  # THE FULL SUITE'S OWN CEILING. The full series was always read - `budget_report` takes
  # `latest(root, "total")` whenever the last commit did not run selected - but it was judged
  # against `seconds`, a figure declared for a COMMIT. A ~899s full run against a 380s
  # per-commit ceiling reads OVER as a matter of course, so the verdict carried no information
  # and nothing watched the number that actually grew: ~630s to ~899s while the suite went
  # 6,610 to 7,417 tests. Declared 2026-08-19 against that measured 899s peak with the same
  # ~20% headroom the per-commit ceiling carries, so a normal full run reads under while a
  # genuine ratchet still flags. Absent, the lane stays SILENT about the full series rather
  # than inventing a default (BG0594).
  # THE RATE CEILING, and the quantity actually being budgeted. A total is selection width times
  # cost-per-test, and width varies continuously here - 1,418 to 5,573 tests across the recorded
  # window - so a seconds ceiling reports a wide commit as a regression and a narrow one as
  # headroom while neither has changed cost. Measured 2026-08-20: the last selected run is
  # 187s/1,539 tests = 0.122 s/test and the last full run 899s/7,417 = 0.121, so the two series
  # now cost the same per test and one ceiling serves both. 0.152 is that norm plus ~25%, which
  # is the band that absorbs the selected series' own spread while still flagging a rise of the
  # size the full suite made unobserved. An OPERATOR SETTING against a measured baseline, never
  # a fitted constant, and it is declared beside the baseline it was chosen against.
  rate_seconds_per_test: 0.152
  rate_baseline_seconds_per_test: 0.122
  rate_baseline_date: 2026-08-20
  full_seconds: 1080
  full_baseline_seconds: 899
  full_baseline_date: 2026-08-19

# Creation-time noise controls, switched on independently of the artefact schema (CR0510).
# They were reachable only through a schema v3 bump that also switches on plan-review,
# spec-guard and the inbox status, so adopting a session cap meant adopting four unrelated
# things - and they had therefore never once run here. Measured over the month before this
# was set: 801 findings filed, ~26 a day, against a cap of 20 sitting unused; 27 of 29 open
# bugs were skeletons; and the low-severity fold was being hand-rolled, one artefact in this
# tree being twenty findings bundled by hand.
#
# A cap is a REFUSAL, not a silent drop: the N+1th filing fails loudly and says how to
# proceed. Start a fresh budget for a genuinely new run with SDLC_TRIAGE_SESSION.
triage:
  enabled: true
  session_cap: 20
  low_consolidation: true

# D0128: raised from the default 4 because BG0516 made four close rounds unactionable -
# the close reported an unattributable refusal while the gate named its failing lane.
# The cap stays and the divergence detector is untouched; revisit when BG0516 lands.
